name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: bun-linux-x64-baseline
            asset: home-linux-x64
          - runner: macos-14
            target: bun-darwin-arm64
            asset: home-darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Resolve version + commit
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          COMMIT="$(git rev-parse --short HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
      - name: Build binary
        run: |
          mkdir -p dist
          bun build --compile \
            --target=${{ matrix.target }} \
            --define "__HOME_VERSION=\"${{ steps.meta.outputs.version }}\"" \
            --define "__HOME_COMMIT=\"${{ steps.meta.outputs.commit }}\"" \
            src/index.ts \
            --outfile dist/${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/home-linux-x64
            dist/home-darwin-arm64
            scripts/install.sh
          generate_release_notes: true
